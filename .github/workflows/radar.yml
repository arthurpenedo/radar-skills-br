name: Radar

# Todo dia: coleta as vagas dos últimos 30 dias na Gupy, gera o relatório e publica no GitHub Pages.
# O JSON das vagas e o resumo ficam como artefato da execução (histórico de 90 dias).
on:
  schedule:
    - cron: "0 10 * * *"  # 7h em Brasília
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Coletar vagas (Gupy + remotas internacionais)
        run: radar-skills coletar --saida vagas.json --remotas
      - name: Baixar a coleta anterior (para a seção "vagas novas")
        run: curl -fsSL -o anterior.json https://arthurpenedo.github.io/radar-skills-br/vagas.json || echo "sem coleta anterior"
      - name: Baixar o histórico publicado (tendência das habilidades)
        run: curl -fsSL -o historico-anterior.json https://arthurpenedo.github.io/radar-skills-br/historico.json || echo "sem histórico anterior"
      - name: Gerar relatório
        run: |
          radar-skills relatorio vagas.json --html site/index.html --resumo site/resumo.json --anterior anterior.json \
            --historico historico --historico-anterior historico-anterior.json
          cp vagas.json site/vagas.json
      - name: Lacunas do perfil de exemplo (no log)
        run: radar-skills lacunas site/resumo.json exemplos/perfil.json
      - uses: actions/upload-artifact@v4
        with:
          name: radar-${{ github.run_number }}
          path: site/
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publicar:
    needs: coletar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
